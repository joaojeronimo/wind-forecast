<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GustForecast • 48-Hour Multi-Model Ensemble Wind Gust Predictions</title>
    <meta name="description" content="Aggregated 48-hour wind gusts speed and direction predictions from multiple global forecast models using Open-Meteo." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2'><path d='M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2'/><path d='M9.6 4.6A2 2 0 1 1 11 8H2'/><path d='M12.6 19.4A2 2 0 1 0 14 16H2'/></svg>" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="theme-dark">
    <!-- Skip to main content for keyboard accessibility -->
    <a href="#main-content" class="skip-link visually-hidden">Skip to main content</a>

    <!-- ARIA Live region for screen reader announcements -->
    <div id="status-live-region" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <div class="app-container">
      <div id="header-container"></div>
      <div id="location-container"></div>
      <div id="alert-container" role="alert" aria-live="assertive"></div>

      <main id="main-content" tabindex="-1">
        <div id="time-scrubber-container"></div>
        <div id="focus-card-container"></div>
        <div id="chart-container"></div>
        <div id="model-selector-container"></div>
        <div id="table-container"></div>
      </main>

      <footer class="app-footer" role="contentinfo">
        <p>
          Weather and ensemble forecast data provided by
          <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>
          under Creative Commons Attribution 4.0 International (CC BY 4.0).
        </p>
        <p>Models: ECMWF IFS, NOAA GFS, DWD ICON, CMC GEM, Météo-France, UK Met Office, JMA.</p>
      </footer>
    </div>

    <!-- Sticky Floating Refresh Button in bottom right corner -->
    <div id="sticky-refresh-container" class="sticky-refresh-container"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
